<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cortex - Chat</title>
    
    <!-- Design System -->
    <link rel="stylesheet" href="/design-tokens.css">
    <link rel="stylesheet" href="/components.css">
    
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    
    <style>
        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* Tab panels need to fill available space */
        .tab-panel {
            flex: 1;
            overflow: hidden;
            display: none;
            flex-direction: column;
        }
        
        .tab-panel.active {
            display: flex;
        }
        
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: var(--spacing-6);
            display: flex;
            flex-direction: column;
            gap: var(--spacing-4);
        }
        
        #input-area {
            display: flex;
            gap: var(--spacing-2);
            padding: var(--spacing-4);
            background: var(--color-bg-secondary);
            border-top: 1px solid var(--color-border-default);
        }
        
        #message-input {
            flex: 1;
            resize: none;
            min-height: 40px;
            max-height: 150px;
            line-height: 1.4;
            overflow-y: auto;
            font-family: inherit;
            font-size: inherit;
        }
        
        /* Thinking indicator */
        .thinking-indicator {
            display: flex;
            align-items: center;
            gap: var(--spacing-2);
            padding: var(--spacing-2) var(--spacing-4);
            color: var(--color-text-secondary);
            font-size: var(--text-sm);
        }
        
        .thinking-dots {
            display: flex;
            gap: 4px;
        }
        
        .thinking-dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--color-text-tertiary, #94a3b8);
            animation: thinking-bounce 1.4s ease-in-out infinite;
        }
        
        .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
        .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes thinking-bounce {
            0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
            40% { opacity: 1; transform: scale(1); }
        }
        
        /* Multiline user messages */
        .message.user { white-space: pre-wrap; }
        
        /* Triage container fills panel */
        #triage-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        /* Scrollbar styling */
        #chat::-webkit-scrollbar {
            width: var(--scrollbar-width);
        }
        
        #chat::-webkit-scrollbar-track {
            background: var(--scrollbar-track);
        }
        
        #chat::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: var(--radius-full);
        }
        
        #chat::-webkit-scrollbar-thumb:hover {
            background: var(--color-slate-600);
        }
        
        /* ==================== Conversation Badges ==================== */
        .conversation-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.125rem 0.5rem;
            border-radius: var(--radius-full);
            font-size: var(--text-xs);
            font-weight: 500;
            margin-left: 0.5rem;
        }
        
        .conversation-badge--group {
            background: var(--color-purple-100);
            color: var(--color-purple-700);
        }
        
        .conversation-badge--channel {
            background: var(--color-blue-100);
            color: var(--color-blue-700);
        }
        
        .conversation-badge--direct {
            background: var(--color-slate-100);
            color: var(--color-slate-600);
        }
        
        /* ==================== Tags Display ==================== */
        .triage-card__tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.375rem;
            margin: 0.5rem 0;
        }
        
        .tag {
            display: inline-flex;
            align-items: center;
            padding: 0.125rem 0.5rem;
            border-radius: var(--radius-sm);
            font-size: var(--text-xs);
            font-weight: 500;
            background: var(--color-slate-100);
            color: var(--color-slate-600);
        }
        
        .tag--urgent {
            background: var(--color-red-100);
            color: var(--color-red-700);
        }
        
        .tag--vip {
            background: var(--color-amber-100);
            color: var(--color-amber-700);
        }
        
        .tag--mention {
            background: var(--color-green-100);
            color: var(--color-green-700);
        }
        
        .tag--action-needed {
            background: var(--color-orange-100);
            color: var(--color-orange-700);
        }
        
        .tag--priority-app {
            background: var(--color-blue-100);
            color: var(--color-blue-700);
        }
        
        /* ==================== AI Thinking Section ==================== */
        .triage-card__ai-thinking {
            margin: 0.75rem 0;
            border: 1px solid var(--color-border-default);
            border-radius: var(--radius-md);
            overflow: hidden;
        }
        
        .triage-card__ai-thinking summary {
            padding: 0.5rem 0.75rem;
            background: var(--color-bg-secondary);
            cursor: pointer;
            font-size: var(--text-sm);
            font-weight: 500;
            color: var(--color-text-secondary);
            user-select: none;
        }
        
        .triage-card__ai-thinking summary:hover {
            background: var(--color-slate-100);
        }
        
        .triage-card__ai-thinking[open] summary {
            border-bottom: 1px solid var(--color-border-default);
        }
        
        .ai-thinking-content {
            padding: 0.75rem;
            background: var(--color-bg-primary);
            max-height: 300px;
            overflow-y: auto;
        }
        
        .ai-thinking-content pre {
            margin: 0;
            font-family: var(--font-mono);
            font-size: var(--text-xs);
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
            color: var(--color-text-secondary);
        }
        
        .ai-thinking-content::-webkit-scrollbar {
            width: 6px;
        }
        
        .ai-thinking-content::-webkit-scrollbar-track {
            background: var(--color-slate-100);
        }
        
        .ai-thinking-content::-webkit-scrollbar-thumb {
            background: var(--color-slate-300);
            border-radius: var(--radius-full);
        }
        
        /* Time display with full date */
        .time-full {
            color: var(--color-slate-500);
            font-size: 0.85em;
        }
        
        .time-with-tooltip {
            cursor: help;
        }
        
        /* Collapsible section styling */
        .triage-section__header--expandable {
            cursor: pointer;
            user-select: none;
            list-style: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .triage-section__header--expandable::-webkit-details-marker {
            display: none;
        }
        
        .triage-section__header--expandable::before {
            content: '▶';
            font-size: 0.75em;
            transition: transform 0.2s ease;
        }
        
        details[open] > .triage-section__header--expandable::before {
            transform: rotate(90deg);
        }
    </style>
</head>
<body>
    <div id="app-header"></div>
    
    <!-- Tab Navigation -->
    <div class="tab-nav">
        <button class="tab-btn active" data-tab="chat">
            <span class="tab-icon">💬</span>
            <span class="tab-label">Chat</span>
        </button>
        <button class="tab-btn" data-tab="triage">
            <span class="tab-icon">📥</span>
            <span class="tab-label">Triage</span>
            <span class="tab-badge" id="triage-badge" style="display: none;">0</span>
        </button>
    </div>
    
    <!-- Chat Tab Panel -->
    <div class="tab-panel active" id="chat-panel">
        <div id="chat"></div>
        
        <div id="input-area">
            <textarea 
                id="message-input" 
                class="form-input" 
                placeholder="Chat with Cortex... (Shift+Enter for new line)"
                rows="1"
                autocomplete="off"
            ></textarea>
            <button id="send-btn" class="btn btn-primary" disabled>Send</button>
        </div>
    </div>
    
    <!-- Triage Tab Panel -->
    <div class="tab-panel" id="triage-panel">
        <div id="triage-container"></div>
    </div>
    
    <script type="module">
        import { requireAuth, getCurrentUser, isAdmin } from './js/auth.js';
        import { showToast } from './js/ui.js';
        import { initHeader } from './components/header.js';

        // Check authentication
        requireAuth();
        
        // Initialize header with current user
        const currentUser = getCurrentUser();
        initHeader('#app-header', {
            title: 'CORTEX',
            subtitle: 'Intelligent Orchestration',
            user: currentUser,
            showAdminLink: isAdmin(),
            showHomeLink: false  // Already on home page
        });
        
        const chat = document.getElementById('chat');
        const input = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        
        // WebSocket connection with JWT token
        const token = localStorage.getItem('access_token');
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/chat/cortex?token=${encodeURIComponent(token)}`;
        let ws = new WebSocket(wsUrl);
        
        // Handle WebSocket closure when logout happens
        let wsClosedByUser = false;
        
        ws.onopen = () => {
            addMessage('Connected', 'system');
            sendBtn.disabled = false;
        };
        
        ws.onclose = (event) => {
            if (!wsClosedByUser) {
                addMessage('Disconnected', 'system');
                sendBtn.disabled = true;
                
                // If closed due to auth error, redirect to login
                if (event.code === 1008) {
                    showToast('Session expired. Please log in again.', 'error');
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 2000);
                }
            }
        };
        
        ws.onerror = (error) => {
            console.error('WebSocket error:', error);
            addMessage('Connection error', 'system');
            showToast('Connection error', 'error');
        };
        
        let thinkingEl = null;
        
        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === 'history' && data.messages) {
                // Load chat history on connect
                if (data.messages.length > 0) {
                    addMessage(`--- Previous conversation (${data.messages.length} messages) ---`, 'system');
                    for (const msg of data.messages) {
                        const isMarkdown = msg.role === 'assistant';
                        addMessage(msg.content, msg.role, isMarkdown);
                    }
                    addMessage('--- End of history ---', 'system');
                }
            } else if (data.error) {
                removeThinking();
                addMessage(`Error: ${data.error}`, 'system');
                showToast(data.error, 'error');
            } else if (data.response) {
                removeThinking();
                addMessage(data.response, 'assistant', true);
            }
        };
        
        function addMessage(text, role, isMarkdown = false) {
            const msg = document.createElement('div');
            msg.className = `message ${role}`;
            
            if (isMarkdown && role === 'assistant') {
                msg.innerHTML = marked.parse(text);
            } else {
                msg.textContent = text;
            }
            
            chat.appendChild(msg);
            chat.scrollTop = chat.scrollHeight;
        }
        
        function showThinking() {
            if (thinkingEl) return;
            thinkingEl = document.createElement('div');
            thinkingEl.className = 'thinking-indicator';
            thinkingEl.innerHTML = `
                <div class="thinking-dots">
                    <span></span><span></span><span></span>
                </div>
                <span>Cortex is thinking...</span>
            `;
            chat.appendChild(thinkingEl);
            chat.scrollTop = chat.scrollHeight;
        }
        
        function removeThinking() {
            if (thinkingEl) {
                thinkingEl.remove();
                thinkingEl = null;
            }
        }
        
        function sendMessage() {
            const message = input.value.trim();
            if (!message) return;
            
            addMessage(message, 'user');
            ws.send(JSON.stringify({ message }));
            input.value = '';
            autoResize();
            showThinking();
        }
        
        // Auto-resize textarea as user types
        function autoResize() {
            input.style.height = 'auto';
            input.style.height = Math.min(input.scrollHeight, 150) + 'px';
        }
        
        input.addEventListener('input', autoResize);
        
        // Enter sends, Shift+Enter adds new line
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        
        sendBtn.addEventListener('click', sendMessage);
        
        // Focus input on load
        input.focus();
    </script>
    
    <!-- Triage Module -->
    <script type="module" src="/js/triage.js"></script>
</body>
</html>
